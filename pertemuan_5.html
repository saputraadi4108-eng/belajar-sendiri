<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Jadwal & Nilai</title>
    <!-- CSS minimal agar tabel terlihat rapi -->
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #333; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>Daftar Nilai Siswa</h2>

    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Matematika</th>
                <th>IPA</th>
                <th>Bahasa Indonesia</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Andi</td>
                <td>85</td>
                <td>90</td>
                <td>88</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Budi</td>
                <td>78</td>
                <td>82</td>
                <td>95</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Citra</td>
                <td>92</td>
                <td>88</td>
                <td>91</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2"><strong>Rata-rata</strong></td>
                <td>85</td>
                <td>86.7</td>
                <td>91.3</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>

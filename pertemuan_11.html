    <main>
        <h1>Hubungi Saya</h1>
        <p>Ada pertanyaan atau ingin bekerja sama? Isi form di bawah!</p>

        <form action="#" method="POST">
            <label for="nama">Nama Lengkap *</label>
            <input type="text" id="nama" name="nama" required placeholder="Nama kamu">

            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required placeholder="email@contoh.com">

            <label for="subjek">Subjek</label>
            <select id="subjek" name="subjek">
                <option value="">-- Pilih Subjek --</option>
                <option value="kerjasama">Kerja Sama</option>
                <option value="tanya">Pertanyaan</option>
                <option value="lainnya">Lainnya</option>
            </select>

            <label for="pesan">Pesan *</label>
            <textarea id="pesan" name="pesan" rows="5" required placeholder="Tulis pesanmu di sini..."></textarea>

            <button type="submit">Kirim Pesan</button>
        </form>

        <hr>

        <h2>Atau hubungi langsung:</h2>

            <li>📧 <a href="mailto:budi@email.com">budi@email.com</a></li>
            <li>📱 <a href="tel:+6281234567890">+62 812-3456-7890</a></li>
            <li>📍 Yogyakarta, Indonesia</li>
        </ul>
